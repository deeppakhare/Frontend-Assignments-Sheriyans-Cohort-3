<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyMart — Premium Shopping Experience</title>
  <meta name="description" content="SkyMart offers a premium online shopping experience with a wide range of products across beauty, electronics, furniture, and more. Fast delivery, great prices." />
  <meta name="keywords" content="SkyMart, online shopping, e-commerce, beauty, electronics, furniture, groceries" />
  <meta property="og:title" content="SkyMart — Premium Shopping Experience" />
  <meta property="og:description" content="Discover thousands of products at SkyMart. Shop beauty, electronics, furniture, and more." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Notification Toast -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Cart Sidebar Overlay -->
  <div id="cart-overlay" class="cart-overlay" role="dialog" aria-modal="true" aria-label="Shopping Cart"></div>

  <!-- Cart Sidebar -->
  <aside id="cart-sidebar" class="cart-sidebar" aria-label="Shopping Cart">
    <div class="cart-header">
      <div class="cart-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        Your Cart
      </div>
      <button id="close-cart-btn" class="close-cart-btn" aria-label="Close cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="cart-items-container" class="cart-items-container"></div>
    <div id="cart-footer" class="cart-footer" style="display:none;">
      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span class="free-shipping">FREE</span>
        </div>
        <div class="summary-row total-row">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
      </div>
      <button id="checkout-btn" class="btn-checkout">Proceed to Checkout</button>
      <button id="continue-shopping-btn" class="btn-continue">Continue Shopping</button>
    </div>
  </aside>

  
  <!-- Header / Navbar -->
  <header id="main-header" class="main-header">
    <div class="header-inner container">
      <a href="#" id="logo-link" class="logo" aria-label="SkyMart Home">
        <span class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        </span>
        SkyMart
      </a>

      <!-- Desktop Nav -->
      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="#" class="nav-link active" data-page="home" id="nav-home">Home</a>
        <a href="#" class="nav-link" data-page="products" id="nav-products">Products</a>
        <a href="#" class="nav-link" data-page="about" id="nav-about">About</a>
        <a href="#" class="nav-link" data-page="contact" id="nav-contact">Contact</a>
      </nav>

      <div class="header-actions">
        <button id="search-toggle-btn" class="icon-btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle theme">
          <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="cart-toggle-btn" class="cart-btn icon-btn" aria-label="Shopping cart">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span id="cart-count" class="cart-badge" aria-label="0 items in cart">0</span>
        </button>
        <!-- Mobile hamburger -->
        <button id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="Open menu" aria-expanded="false">
          <svg id="hamburger-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile Search Bar -->
    <div id="search-bar" class="search-bar-container" style="display:none;">
      <div class="container">
        <div class="search-input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="search-input" placeholder="Search products..." autocomplete="off" aria-label="Search products" />
          <button id="search-clear-btn" class="search-clear" style="display:none;" aria-label="Clear search">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <nav id="mobile-nav" class="mobile-nav" style="display:none;" aria-label="Mobile navigation">
      <a href="#" class="nav-link active" data-page="home">Home</a>
      <a href="#" class="nav-link" data-page="products">Products</a>
      <a href="#" class="nav-link" data-page="about">About</a>
      <a href="#" class="nav-link" data-page="contact">Contact</a>
    </nav>
  </header>
