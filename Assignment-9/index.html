<!DOCTYPE html>
<html lang="en">
 <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assigenment-9</title>
    <!-- Google Fonts: Inter & Segoe UI fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
<body>
     <!-- Desktop Environment -->
    <div id="desktop" class="desktop">
      <!-- Desktop Icons Grid -->
      <div class="desktop-icons">
        <!-- Todo Shortcut -->
        <button
          class="desktop-icon"
          id="shortcut-todo"
          aria-label="Open Todo List"
        >
          <div class="icon-wrapper todo-icon-color">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="9 11 12 14 22 4"></polyline>
              <path
                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
              ></path>
            </svg>
          </div>
          <span class="icon-label">Todo</span>
        </button>

        <!-- Daily Planner Shortcut -->
        <button
          class="desktop-icon"
          id="shortcut-planner"
          aria-label="Open Daily Planner"
        >
          <div class="icon-wrapper planner-icon-color">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <span class="icon-label">Daily Planner</span>
        </button>

        <!-- Motivation Quote Shortcut -->
        <button
          class="desktop-icon"
          id="shortcut-quote"
          aria-label="Open Motivation Quote"
        >
          <div class="icon-wrapper quote-icon-color">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
              ></path>
            </svg>
          </div>
          <span class="icon-label">Motivation</span>
        </button>

        <!-- Pomodoro Timer Shortcut -->
        <button
          class="desktop-icon"
          id="shortcut-pomodoro"
          aria-label="Open Pomodoro Timer"
        >
          <div class="icon-wrapper pomodoro-icon-color">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </div>
          <span class="icon-label">Pomodoro</span>
        </button>

        <!-- Daily Goals Shortcut -->
        <button
          class="desktop-icon"
          id="shortcut-goals"
          aria-label="Open Daily Goals"
        >
          <div class="icon-wrapper goals-icon-color">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="7"></circle>
              <polyline
                points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"
              ></polyline>
            </svg>
          </div>
          <span class="icon-label">Daily Goals</span>
        </button>
      </div>
      <!-- Window Manager for Feature Windows -->
      <div id="window-container">
        <!-- Todo Window -->
        <div id="window-todo" class="window hidden" data-app="todo">
          <div class="window-header">
            <div class="window-header-title">
              <svg
                class="window-app-icon todo-icon-color"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
              >
                <polyline points="9 11 12 14 22 4"></polyline>
                <path
                  d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"
                ></path>
              </svg>
              <span>Todo List</span>
            </div>
            <div class="window-controls">
              <button class="win-btn minimize" aria-label="Minimize Window">
                <i class="ri-subtract-line"></i>
              </button>
              <button class="win-btn maximize" aria-label="Maximize Window">
                <i class="ri-square-line"></i>
              </button>
              <button class="win-btn close" aria-label="Close Window">
                <i class="ri-close-large-line"></i>
              </button>
            </div>
          </div>
          <div class="window-body">
            <div class="app-layout">
              <div class="todo-input-bar">
                <input
                  type="text"
                  id="todo-input"
                  placeholder="Type a task and press Enter..."
                  aria-label="Task content"
                />
                <button
                  id="todo-star-btn"
                  class="todo-star-btn"
                  title="Mark as Important"
                  aria-label="Mark task as important"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polygon
                      points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                    ></polygon>
                  </svg>
                </button>
                <button id="add-todo-btn" class="primary-btn">Add Task</button>
              </div>

              <div class="todo-container-scroll">
                <div class="todo-section">
                  <h3>Active Tasks</h3>
                  <ul id="todo-list-active" class="todo-list"></ul>
                </div>
                <div class="todo-section">
                  <h3>Completed Tasks</h3>
                  <ul
                    id="todo-list-completed"
                    class="todo-list completed-style"
                  ></ul>
                </div>
              </div>
            </div>
          </div>
        </div>

</body>
</html>
