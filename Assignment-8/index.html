<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <div id="div1">
        <div class="first">
          <div class="logo">
            <div class="logo-1">
              <i class="ri-swap-line"></i>
            </div>
            <div class="logo-2">
              <h3>FinTrack Pro</h3>
              <p>Enterprise Finance</p>
            </div>
          </div>
          <div class="dashboard">
            <button><i class="ri-home-8-line"></i> Dashboard</button>
            <button><i class="ri-calculator-line"></i> Calculator</button>
            <button><i class="ri-settings-5-line"></i> Setting</button>
            <button><i class="ri-contacts-line"></i> Contact</button>
            <button><i class="ri-question-line"></i> Help & Support</button>
          </div>
        </div>
        <div class="second">
          <div class="premium">
            <div class="goPre">
              <div class="crown">
                <i class="ri-vip-crown-2-fill"></i>
              </div>
              <h3>Go Premium</h3>
              <p>Unlock advanced analytics,</p>
              <p>export data and more</p>
            </div>
            <div class="preBtn">
              <button>Upgrade Now <i class="ri-arrow-right-line"></i></button>
            </div>
          </div>
          <div class="addBtn">
            <button><i class="ri-add-large-line"></i> Add Transaction</button>
          </div>
        </div>
      </div>
      <div id="div2">
        <div class="text">
          <h3>Welcome back, <span class="userName"></span>👋</h3>
          <p>Here's is your finanacial overview today.</p>
        </div>
        <div class="profile">
          <h3><i class="ri-user-6-line"></i></h3>
          <div class="logout" id="logoutBtn">
            <button><i class="ri-logout-box-r-line"></i> Logout</button>
          </div>
        </div>
      </div>
      <div id="div3">
        <div class="current">
          <i class="ri-wallet-line"></i>
        </div>
        <div class="current-text">
          <h3>Current Balane </h3>
          <h2><h2 id=""></h2></h2>
        </div>
      </div>
      <div id="div4"></div>
      <div id="div5"></div>
      <div id="div6"></div>
      <div id="div7"></div>
      <div id="div8"></div>
      <div id="div9"></div>
      <div id="div9"></div>
      <div id="div10"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
